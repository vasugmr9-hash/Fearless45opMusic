<svg xmlns="http://www.w3.org/2000/svg"
     width="960"
     height="340"
     viewBox="0 0 960 340">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="45%" stop-color="#100720"/>
      <stop offset="100%" stop-color="#03030b"/>
    </linearGradient>

    <!-- Main text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Animated border -->
    <linearGradient id="borderGrad"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc">
        <animate attributeName="stop-color"
                 values="#c084fc;#22d3ee;#f472b6;#a78bfa;#c084fc"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color"
                 values="#818cf8;#f472b6;#22d3ee;#c084fc;#818cf8"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color"
                 values="#22d3ee;#c084fc;#a78bfa;#22d3ee"
                 dur="5s"
                 repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Pink glow -->
    <radialGradient id="pinkGlow">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <!-- Text glow -->
    <filter id="textGlow"
            x="-20%"
            y="-50%"
            width="140%"
            height="200%">

      <feGaussianBlur stdDeviation="7"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Border glow -->
    <filter id="borderGlow"
            x="-10%"
            y="-10%"
            width="120%"
            height="120%">

      <feGaussianBlur stdDeviation="4"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Note glow -->
    <filter id="noteGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <clipPath id="clip">
      <rect x="0"
            y="0"
            width="960"
            height="340"
            rx="25"/>
    </clipPath>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="960"
        height="340"
        rx="25"
        fill="url(#bg)"/>


  <!-- ================= GLOW ORBS ================= -->

  <ellipse cx="130"
           cy="100"
           rx="180"
           ry="130"
           fill="url(#purpleGlow)">

    <animate attributeName="rx"
             values="180;220;180"
             dur="6s"
             repeatCount="indefinite"/>

  </ellipse>


  <ellipse cx="830"
           cy="250"
           rx="190"
           ry="145"
           fill="url(#cyanGlow)">

    <animate attributeName="rx"
             values="190;230;190"
             dur="7s"
             repeatCount="indefinite"/>

  </ellipse>


  <ellipse cx="500"
           cy="170"
           rx="220"
           ry="110"
           fill="url(#pinkGlow)">

    <animate attributeName="ry"
             values="110;145;110"
             dur="5s"
             repeatCount="indefinite"/>

  </ellipse>


  <!-- ================= STARS ================= -->

  <g clip-path="url(#clip)" fill="white">

    <circle cx="45" cy="25" r="1.5">
      <animate attributeName="opacity"
               values="0.1;0.8;0.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="120" cy="65" r="1">
      <animate attributeName="opacity"
               values="0.1;0.7;0.1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="210" cy="20" r="1.5">
      <animate attributeName="opacity"
               values="0.1;0.6;0.1"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="330" cy="35" r="1">
      <animate attributeName="opacity"
               values="0.1;0.7;0.1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="15" r="1.5">
      <animate attributeName="opacity"
               values="0.1;0.6;0.1"
               dur="3.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="570" cy="40" r="1">
      <animate attributeName="opacity"
               values="0.1;0.7;0.1"
               dur="4.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="20" r="1.5">
      <animate attributeName="opacity"
               values="0.1;0.6;0.1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="810" cy="65" r="1">
      <animate attributeName="opacity"
               values="0.1;0.7;0.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="25" r="1.5">
      <animate attributeName="opacity"
               values="0.1;0.8;0.1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="70" cy="210" r="1">
      <animate attributeName="opacity"
               values="0.1;0.7;0.1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="880" cy="210" r="1.5">
      <animate attributeName="opacity"
               values="0.1;0.7;0.1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="500" cy="320" r="1.5">
      <animate attributeName="opacity"
               values="0.1;0.6;0.1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

  </g>


  <!-- ================= NEON BORDER ================= -->

  <rect x="2"
        y="2"
        width="956"
        height="336"
        rx="23"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="3"
        filter="url(#borderGlow)">

    <animate attributeName="opacity"
             values="1;0.45;1"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================= VINYL RECORD ================= -->

  <g transform="translate(145 170)"
     filter="url(#textGlow)">

    <!-- Outer pulse -->

    <circle cx="0"
            cy="0"
            r="95"
            fill="none"
            stroke="#a855f7"
            stroke-width="2"
            opacity="0.25">

      <animate attributeName="r"
               values="90;112;90"
               dur="3s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="0.25;0;0.25"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>


    <!-- Rotating record -->

    <g>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="8s"
        repeatCount="indefinite"/>


      <circle cx="0"
              cy="0"
              r="84"
              fill="#090712"
              stroke="#38205c"
              stroke-width="2"/>


      <circle cx="0"
              cy="0"
              r="70"
              fill="none"
              stroke="#24133f"
              stroke-width="2"/>


      <circle cx="0"
              cy="0"
              r="58"
              fill="none"
              stroke="#32174f"
              stroke-width="2"/>


      <circle cx="0"
              cy="0"
              r="46"
              fill="none"
              stroke="#24133f"
              stroke-width="2"/>


      <circle cx="0"
              cy="0"
              r="34"
              fill="none"
              stroke="#32174f"
              stroke-width="2"/>


      <!-- Record highlights -->

      <path d="M0,-84
               A84,84 0 0 1 72.7,-42
               L0,0Z"
            fill="#351060"
            opacity="0.7"/>


      <path d="M72.7,-42
               A84,84 0 0 1 72.7,42
               L0,0Z"
            fill="#1d0d3a"
            opacity="0.7"/>


      <path d="M72.7,42
               A84,84 0 0 1 0,84
               L0,0Z"
            fill="#101f3d"
            opacity="0.7"/>


      <path d="M0,84
               A84,84 0 0 1 -72.7,42
               L0,0Z"
            fill="#0b263c"
            opacity="0.7"/>


      <path d="M-72.7,42
               A84,84 0 0 1 -72.7,-42
               L0,0Z"
            fill="#1a0a30"
            opacity="0.7"/>


      <path d="M-72.7,-42
               A84,84 0 0 1 0,-84
               L0,0Z"
            fill="#290c4d"
            opacity="0.7"/>

    </g>


    <!-- Record center -->

    <circle cx="0"
            cy="0"
            r="19"
            fill="#c084fc"/>


    <circle cx="0"
            cy="0"
            r="12"
            fill="#7c3aed"/>


    <circle cx="0"
            cy="0"
            r="5"
            fill="#f0abfc"/>


    <!-- Needle -->

    <line x1="55"
          y1="-65"
          x2="8"
          y2="-5"
          stroke="#e2e8f0"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.8"/>


    <circle cx="55"
            cy="-65"
            r="4"
            fill="#94a3b8"/>

  </g>


  <!-- ================= FLOATING MUSIC NOTES ================= -->

  <text x="835"
        y="55"
        font-size="25"
        font-family="serif"
        fill="#c084fc"
        filter="url(#noteGlow)"
        opacity="0">

    ♪

    <animate attributeName="opacity"
             values="0;0.9;0.7;0"
             dur="6s"
             repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0;-8,-20;0,-40;8,-20;0,0"
      dur="6s"
      repeatCount="indefinite"/>

  </text>


  <text x="890"
        y="110"
        font-size="20"
        font-family="serif"
        fill="#22d3ee"
        filter="url(#noteGlow)"
        opacity="0">

    ♫

    <animate attributeName="opacity"
             values="0;0.8;0.6;0"
             dur="5s"
             repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0;5,-15;0,-30;-5,-15;0,0"
      dur="5s"
      repeatCount="indefinite"/>

  </text>


  <text x="265"
        y="305"
        font-size="23"
        font-family="serif"
        fill="#f472b6"
        filter="url(#noteGlow)"
        opacity="0">

    ♬

    <animate attributeName="opacity"
             values="0;0.8;0.6;0"
             dur="5.5s"
             repeatCount="indefinite"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0;4,-12;0,-25;-4,-12;0,0"
      dur="5.5s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================= MAIN NAME ================= -->

  <text x="275"
        y="130"
        font-size="52"
        font-weight="900"
        fill="url(#titleGrad)"
        filter="url(#textGlow)"
        font-family="'Segoe UI','Arial Unicode MS','Noto Sans',sans-serif"
        letter-spacing="-1">

    ⚝ 𝐅ᴇᴀʀʟᴇss ꭗ 𝐌ᴜsɪᴄ ᯤ

    <animate attributeName="opacity"
             values="1;0.88;1"
             dur="4s"
             repeatCount="indefinite"/>

  </text>


  <!-- ================= UNDERLINE ================= -->

  <rect x="278"
        y="145"
        width="0"
        height="3"
        rx="2"
        fill="url(#titleGrad)"
        opacity="0.9">

    <animate attributeName="width"
             values="0;625"
             dur="1.3s"
             begin="0.3s"
             fill="freeze"/>

  </rect>


  <!-- ================= SUBTITLE ================= -->

  <text x="280"
        y="178"
        font-size="15"
        font-weight="600"
        fill="#94a3b8"
        letter-spacing="3"
        font-family="'Segoe UI',Arial,sans-serif">

    TELEGRAM MUSIC BOT  •  HD AUDIO  •  FAST &amp; STABLE

  </text>


  <!-- ================= WAVEFORM ================= -->

  <g transform="translate(280 205)">

    <rect x="0" y="20" width="10" height="20"
          rx="5" fill="#c084fc">
      <animate attributeName="height"
               values="20;7;28;20"
               dur="0.5s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="20;26.5;16;20"
               dur="0.5s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="17" y="14" width="10" height="32"
          rx="5" fill="#a78bfa">
      <animate attributeName="height"
               values="32;10;40;32"
               dur="0.6s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="14;25;10;14"
               dur="0.6s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="34" y="8" width="10" height="44"
          rx="5" fill="#818cf8">
      <animate attributeName="height"
               values="44;16;50;44"
               dur="0.45s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="8;22;5;8"
               dur="0.45s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="51" y="17" width="10" height="26"
          rx="5" fill="#60a5fa">
      <animate attributeName="height"
               values="26;8;38;26"
               dur="0.55s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="17;26;11;17"
               dur="0.55s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="68" y="4" width="10" height="50"
          rx="5" fill="#38bdf8">
      <animate attributeName="height"
               values="50;15;45;50"
               dur="0.5s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="4;21.5;7;4"
               dur="0.5s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="85" y="15" width="10" height="28"
          rx="5" fill="#22d3ee">
      <animate attributeName="height"
               values="28;7;42;28"
               dur="0.65s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="15;25.5;8;15"
               dur="0.65s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="102" y="10" width="10" height="38"
          rx="5" fill="#67e8f9">
      <animate attributeName="height"
               values="38;12;46;38"
               dur="0.48s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="10;23;6;10"
               dur="0.48s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="119" y="20" width="10" height="20"
          rx="5" fill="#a5f3fc">
      <animate attributeName="height"
               values="20;5;30;20"
               dur="0.58s"
               repeatCount="indefinite"/>
      <animate attributeName="y"
               values="20;27.5;15;20"
               dur="0.58s"
               repeatCount="indefinite"/>
    </rect>

  </g>


  <!-- ================= BOTTOM TAG ================= -->

  <rect x="280"
        y="275"
        width="270"
        height="34"
        rx="17"
        fill="#ffffff"
        fill-opacity="0.04"
        stroke="#818cf8"
        stroke-opacity="0.45"/>


  <text x="415"
        y="297"
        text-anchor="middle"
        font-size="13"
        font-weight="700"
        fill="#c4b5fd"
        letter-spacing="2"
        font-family="'Segoe UI',Arial,sans-serif">

    ⚡ FEARLESS X MUSIC ⚡

  </text>


  <!-- ================= FINAL GLOW LINE ================= -->

  <line x1="280"
        y1="325"
        x2="900"
        y2="325"
        stroke="url(#titleGrad)"
        stroke-width="1"
        opacity="0.5">

    <animate attributeName="x2"
             values="550;900;550"
             dur="4s"
             repeatCount="indefinite"/>

  </line>

</svg>
